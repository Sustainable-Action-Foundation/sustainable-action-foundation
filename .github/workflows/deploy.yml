name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch’s name
  push:
    branches: [ master ]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PB_USERNAME: ${{ secrets.PB_USERNAME  }}
      PB_PASSWORD: ${{ secrets.PB_PASSWORD }}
      PB_URL: ${{ secrets.PB_URL }}
      PUBLIC_BACKEND_URL: ${{ vars.PUBLIC_BACKEND_URL }} 
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack (yarn)
        run: corepack enable yarn
    
      - name: Checkout your repository using git
        uses: actions/checkout@v6

      - name: CI PocketBase auth check
        run: |
          if [ -z "$PB_URL" ] || [ -z "$PB_USERNAME" ] || [ -z "$PB_PASSWORD" ]; then
            echo "One of PB_URL / PB_USERNAME / PB_PASSWORD is missing"; exit 1
          fi
          node -e "const PocketBase=require('pocketbase');const pb=new PocketBase(process.env.PB_URL);pb.admins.authWithPassword(process.env.PB_USERNAME,process.env.PB_PASSWORD).then(r=>{console.log('AUTH OK', !!r.token);console.log('admin id:', r.record?.id);}).catch(e=>{console.error('AUTH ERR', e);process.exit(1);});"
        
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          package-manager: yarn@4.14.1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5